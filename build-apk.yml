name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool m4 pkg-config build-essential libffi-dev liblzma-dev libbz2-dev libreadline-dev libsqlite3-dev zlib1g-dev libssl-dev openjdk-17-jdk-headless unzip zip
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Cache buildozer (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Install buildozer
        run: |
          python -m pip install "pip<24.1"
          pip install --upgrade buildozer cython

      - name: Patch p4a for pip 26 android wheel
        run: |
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git /tmp/p4a_patched
          python - <<'EOF'
          p = '/tmp/p4a_patched/pythonforandroid/build.py'
          s = open(p, encoding='utf-8').read()
          old = "install -v --target '{0}' --no-deps -r requirements.txt"
          new = "install -v --target '{0}' --no-deps --platform android_24_arm64_v8a --python-version 3.14 --implementation cp --abi cp314 -r requirements.txt"
          if old not in s:
              raise SystemExit('PATTERN NOT FOUND')
          s = s.replace(old, new)
          open(p, 'w', encoding='utf-8').write(s)
          print('p4a patched OK')
          EOF

      - name: Build debug APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeauto-apk
          path: bin/*.apk
